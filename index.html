<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Know Leap Strategies</title>
<meta content="width=device-width, initial-scale=1" name="viewport"/>
<meta content="Digital products, web presence enhancement, content systems, and social identity consulting for startups and small to mid-cap teams." name="description"/>
<style>
    :root {
      --white: #ffffff;
      --gray-50: #f7f8fa;
      --gray-100: #eef0f3;
      --gray-200: #e4e7ec;
      --ink: #0b1220;
      --muted: #475569;
      --border: rgba(11, 18, 32, 0.12);
      --shadow: 0 10px 30px rgba(11, 18, 32, 0.08);
      --black-pearl: #0b0f14;
      --enlightenment-gray: #a6afb9;
      --max: 1100px;
    }

    * { box-sizing: border-box; cursor: none !important; } /* Custom cursor requirement */

    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      color: var(--ink);
      background: var(--white);
      line-height: 1.6;
      overflow-x: hidden;
    }

    /* Custom Cursor Element */
    #kls-cursor {
      position: fixed;
      width: 20px;
      height: 20px;
      background: var(--black-pearl);
      border-radius: 50%;
      pointer-events: none;
      z-index: 9999;
      mix-blend-mode: difference;
    }

    .wrap { max-width: var(--max); margin: 0 auto; padding: 0 1.5rem; }

    header {
      position: sticky;
      top: 0;
      background: rgba(255,255,255,0.8);
      backdrop-filter: blur(12px);
      z-index: 100;
      border-bottom: 1px solid var(--border);
    }

    .nav { display: flex; justify-content: space-between; align-items: center; padding: 1rem 0; }

    nav a {
      position: relative;
      margin-left: 1.5rem;
      font-size: 0.9rem;
      color: var(--muted);
      text-decoration: none;
      padding-bottom: 4px;
    }

    /* Gradient Underline Pseudo-element */
    nav a::after {
      content: "";
      position: absolute;
      width: 100%;
      height: 2px;
      bottom: 0;
      left: 0;
      background: linear-gradient(90deg, #0b0f14, #a6afb9, #0b0f14);
      transform: scaleX(0);
      transform-origin: bottom right;
      transition: transform 0.4s ease-out;
    }
    nav a:hover::after {
      transform: scaleX(1);
      transform-origin: bottom left;
    }

    .btn {
      display: inline-flex;
      padding: 0.8rem 1.8rem;
      border-radius: 50px;
      font-weight: 700;
      transition: transform 0.2s;
      background: var(--black-pearl);
      color: white;
      text-decoration: none;
    }

    main section { padding: 6rem 0; position: relative; z-index: 2; }
    .gray-bg { background: var(--gray-50); }

    /* Noodle Canvas */
    #noodle-canvas {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
      z-index: 1; /* Behind headers */
    }
    .noodle-path {
      fill: none;
      stroke: var(--enlightenment-gray);
      stroke-width: 3;
      stroke-dasharray: 10, 10;
      opacity: 0.4;
    }

    .kls-char { display: inline-block; will-change: transform; }

    img { 
        max-width: 100%; 
        border-radius: 12px; 
        transition: filter 0.5s ease;
    }

    footer { padding: 4rem 0; background: var(--gray-100); border-top: 1px solid var(--border); }
    .footer-nav { display: flex; gap: 1.5rem; margin-top: 2rem; flex-wrap: wrap; }
</style>
</head>

<body>
<div id="kls-cursor"></div>
<div class="kls-progress" style="position:fixed; top:0; left:0; height:4px; background:var(--black-pearl); width:0%; z-index:1000;"></div>

<header>
  <div class="wrap nav">
    <div class="brand"><strong>KNOW LEAP</strong></div>
    <nav>
      <a class="kls-magnet" href="#who">Who</a>
      <a class="kls-magnet" href="#services">Services</a>
      <a class="kls-magnet" href="#process">How It Works</a>
      <a class="btn kls-magnet" href="#contact">Start Here</a>
    </nav>
  </div>
</header>

<main style="position: relative;">
  <svg id="noodle-canvas"><path class="noodle-path" d=""></path></svg>

  <section class="white">
    <div class="wrap">
      <h1 class="kls-bounce-text">Clear Systems for Complex Decisions</h1>
      <p>Strategic clarity for modern teams.</p>
    </div>
  </section>

  <section id="who" class="gray-bg">
    <div class="wrap">
      <h2 class="kls-bounce-text">Who We Serve</h2>
      <img src="assets/images/sections/who.jpg" alt="Team" class="gsap-img">
    </div>
  </section>

  <section id="services">
    <div class="wrap">
      <h2 class="kls-bounce-text">Services</h2>
      <img src="assets/images/sections/services.jpg" alt="Services" class="gsap-img">
    </div>
  </section>

  <section id="process" class="gray-bg">
    <div class="wrap">
      <h2 class="kls-bounce-text">How It Works</h2>
      <img src="assets/images/sections/process.jpg" alt="Process" class="gsap-img">
    </div>
  </section>

  <section id="contact">
    <div class="wrap">
      <h2 class="kls-bounce-text">Contact</h2>
      <p>Let's build something together.</p>
      <a href="mailto:hello@knowleap.com" class="btn kls-magnet">Send Message</a>
    </div>
  </section>
</main>

<footer>
  <div class="wrap">
    <div class="footer-nav">
      <a class="kls-magnet" href="#who">Who</a>
      <a class="kls-magnet" href="#services">Services</a>
      <a class="kls-magnet" href="#contact">Contact</a>
      <a class="kls-magnet" href="privacy.html">Privacy</a>
      <a class="kls-magnet" href="terms.html">Terms</a>
      <a class="kls-magnet" href="support.html">Support</a>
    </div>
  </div>
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

<script>
  gsap.registerPlugin(ScrollTrigger);

  // 1. Weighty Falling Ball Bounce
  const bounceElements = document.querySelectorAll('.kls-bounce-text');
  bounceElements.forEach(el => {
    const text = el.innerText;
    el.innerHTML = text.split('').map(c => `<span class="kls-char">${c === ' ' ? '&nbsp;' : c}</span>`).join('');
    
    const chars = el.querySelectorAll('.kls-char');
    
    gsap.from(chars, {
      scrollTrigger: {
        trigger: el,
        start: "top 85%",
        toggleActions: "play none none reverse"
      },
      y: -150,
      opacity: 0,
      stagger: 0.03,
      duration: 1.2,
      ease: "bounce.out" // Weighty falling effect
    });
  });

  // 2. Magnetic Cursor with Elastic Pull
  const cursor = document.querySelector('#kls-cursor');
  window.addEventListener('mousemove', (e) => {
    gsap.to(cursor, { x: e.clientX, y: e.clientY, duration: 0.1 });
  });

  document.querySelectorAll('.kls-magnet').forEach(btn => {
    btn.addEventListener('mousemove', (e) => {
      const rect = btn.getBoundingClientRect();
      const x = e.clientX - rect.left - rect.width/2;
      const y = e.clientY - rect.top - rect.height/2;
      
      gsap.to(btn, {
        x: x * 0.4,
        y: y * 0.4,
        duration: 0.6,
        ease: "elastic.out(1, 0.3)"
      });
      gsap.to(cursor, { scale: 3, opacity: 0.2 });
    });
    
    btn.addEventListener('mouseleave', () => {
      gsap.to(btn, { x: 0, y: 0, duration: 0.7, ease: "elastic.out(1, 0.3)" });
      gsap.to(cursor, { scale: 1, opacity: 1 });
    });
  });

  // 3. Image Fade In/Out
  gsap.utils.toArray(".gsap-img").forEach(img => {
    gsap.fromTo(img, 
      { opacity: 0, filter: "blur(10px)" },
      { 
        opacity: 1, 
        filter: "blur(0px)",
        scrollTrigger: {
          trigger: img,
          start: "top 90%",
          end: "bottom 10%",
          toggleActions: "play reverse play reverse"
        }
      }
    );
  });

  // 4. Snaking Noodle Logic
  const noodlePath = document.querySelector('.noodle-path');
  const main = document.querySelector('main');
  
  function drawNoodle() {
    const sections = document.querySelectorAll('section');
    let pathData = `M ${window.innerWidth/2} 0`;
    
    sections.forEach((sec, i) => {
      const rect = sec.getBoundingClientRect();
      const relativeTop = sec.offsetTop;
      const x = (i % 2 === 0) ? window.innerWidth * 0.2 : window.innerWidth * 0.8;
      pathData += ` Q ${window.innerWidth/2} ${relativeTop}, ${x} ${relativeTop + rect.height/2}`;
    });
    
    noodlePath.setAttribute('d', pathData);
  }

  window.addEventListener('resize', drawNoodle);
  drawNoodle();

  // Progress Bar
  gsap.to(".kls-progress", {
    width: "100%",
    ease: "none",
    scrollTrigger: { scrub: 0.3 }
  });
</script>
</body>
</html>
